name: flutter_web_auth_2_desktop_webview
description: Authenticates in an in-app webview on Linux and Windows, for flutter_web_auth_2.
version: 6.0.0-alpha.8
resolution: workspace
homepage: https://github.com/ThexXTURBOXx/flutter_web_auth_2
repository: https://github.com/ThexXTURBOXx/flutter_web_auth_2
issue_tracker: https://github.com/ThexXTURBOXx/flutter_web_auth_2/issues
funding:
  - https://github.com/sponsors/ThexXTURBOXx
topics:
  - authentication
  - network
  - oauth
  - webview

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  desktop_webview_window: ^0.3.0
  flutter:
    sdk: flutter
  flutter_web_auth_2: ^6.0.0-alpha.8
  flutter_web_auth_2_platform_interface: ^6.0.0-alpha.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      linux:
        dartPluginClass: FlutterWebAuth2DesktopWebview
        fileName: flutter_web_auth_2_desktop_webview.dart
      windows:
        dartPluginClass: FlutterWebAuth2DesktopWebview
        fileName: flutter_web_auth_2_desktop_webview.dart
